# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anba_paula_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootroot}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:YW5iYVBhdWxhQ2h1cmNoU2VjcmV0S2V5Rm9ySldUVG9rZW5zMjU2Qml0c0xvbmdLZXk=}
app.jwt.expiration-ms=86400000

# File uploads
app.upload.dir=${UPLOAD_DIR:uploads}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin seed credentials
app.admin.email=${ADMIN_EMAIL:admin@anbapaulachurch.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# CORS allowed origins (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}